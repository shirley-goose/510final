<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet2Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #fdecd8;
      width: 220px;
      padding: 20px 18px 18px;
      color: #1e1e2e;
    }

    .logo {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
    }

    .toggle-btn {
      width: 100%;
      padding: 11px 0;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .toggle-btn.on {
      background: #ff8c2a;
      color: #fff;
      box-shadow: 0 4px 0 #c96800;
    }
    .toggle-btn.on:hover  { transform: translateY(-1px); box-shadow: 0 6px 0 #c96800; }
    .toggle-btn.on:active { transform: translateY(2px);  box-shadow: 0 2px 0 #c96800; }

    .toggle-btn.off {
      background: #fff;
      color: #1e1e2e;
      box-shadow: 0 4px 0 #ccc;
      border: 2px solid #e0d6cc;
    }
    .toggle-btn.off:hover  { transform: translateY(-1px); box-shadow: 0 6px 0 #ccc; }
    .toggle-btn.off:active { transform: translateY(2px);  box-shadow: 0 2px 0 #ccc; }

    .hint {
      font-size: 11px;
      color: #7a7a8a;
      margin-top: 10px;
      text-align: center;
      line-height: 1.4;
    }

    .hint a {
      color: #ff8c2a;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="logo">🐾 Pet2Companion</div>
  <button id="toggleBtn" class="toggle-btn off">…</button>
  <p id="status" class="hint">Checking…</p>
  <script src="popup.js"></script>
</body>
</html>
